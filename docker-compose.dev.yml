services:
  backend:
    image: golang:1.23-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - go_mod_cache:/root/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    environment:
      MAX_HISTORY: ${MAX_HISTORY:-5}
      PORT: "8080"
    # air provides hot-reload; go mod tidy generates go.sum on first run
    command: >
      sh -c "go install github.com/air-verse/air@latest 2>/dev/null;
             go mod tidy &&
             air"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

volumes:
  go_mod_cache:
  go_build_cache:
  node_modules:
